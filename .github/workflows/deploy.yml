name: Node.js CI/CD (Deploy to Server)

on:
  push:
    branches: [ main ] # On push to main
  workflow_dispatch:

env:
  TARGET_DIR: "/var/www/android-notification-server"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install dependencies and Build
      run: |
        npm ci
        npm run build

    - name: Debug Info (IP and Dist Folder Content)
      run: |
        echo "=== Connection info ==="
        echo "IP from GitHub Secrets:"

        echo "${{ secrets.SSH_HOST }}" | sed 's/\([0-9]*\)\.\([0-9]*\)\..*/\1.\2.X.X/'
        
        echo -e "\n=== dist folder ==="
        if [ -d "dist" ]; then
          ls -la dist/
        else
          echo "Error: dist doesn't exist!"
        fi

    - name: Deploy to Server
      uses: easingthemes/ssh-deploy@v6.0.3
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        ARGS: "-rlgoDIVz --delete" # rsync args 
        SOURCE: "dist/"            # src to copy
        REMOTE_HOST: ${{ secrets.SSH_HOST }}
        REMOTE_USER: ${{ secrets.SSH_USER }}
        REMOTE_PORT: ${{ secrets.SSH_PORT }}
        TARGET: "${{ env.TARGET_DIR }}/dist"

    - name: Copy dist to Server via SCP
      run: |
        echo "${{ secrets.SSH_KEY }}" > deploy_key
        chmod 600 deploy_key
        scp -P ${{ secrets.SSH_PORT }} -i deploy_key -o StrictHostKeyChecking=no -r dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/dist_transfer
        rm deploy_key

    - name: Restart PM2 process
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd $TARGET_DIR
          pm2 restart android-notification-server || pm2 start dist/app.js --name android-notification-server
