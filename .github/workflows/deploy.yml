name: Node.js CI/CD (Deploy to Server)

on:
  push:
    branches: [ main ] # On push to main
  workflow_dispatch:

env:
  TARGET_DIR: "/var/www/android-notification-server"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install dependencies and Build
      run: |
        npm ci
        npm run build

    - name: Debug Info (IP and Dist Folder Content)
      run: |
        echo "=== Connection info ==="
        echo "IP from GitHub Secrets:"

        echo "${{ secrets.SSH_HOST }}" | sed 's/\([0-9]*\)\.\([0-9]*\)\..*/\1.\2.X.X/'
        
        echo -e "\n=== dist folder ==="
        if [ -d "dist" ]; then
          ls -la dist/
        else
          echo "Error: dist doesn't exist!"
        fi

    - name: Copy dist to Server via rsync
      run: |
        echo "${{ secrets.SSH_KEY }}" > deploy_key
        chmod 600 deploy_key

        rsync -avz --delete \
          -e "ssh -p ${{ secrets.SSH_PORT }} -i deploy_key -o StrictHostKeyChecking=no" \
          dist/ \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.TARGET_DIR }}

        rm deploy_key


    - name: Restart PM2 process
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          . ~/.nvm/nvm.sh
          cd $TARGET_DIR
          pm2 restart android-notification-server || pm2 start dist/app.js --name android-notification-server
